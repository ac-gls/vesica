name: ci

on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh tests/install.sh tests/lifecycle-linux.sh
      - name: Installer integration tests
        run: bash tests/install.sh

  # Plan S7/S8: install/uninstall lifecycle and personal-vault/shared-home Git isolation on
  # GitHub-hosted Linux VMs (not containers or WSL). Evidence goes to the job summary and an artifact.
  lifecycle:
    name: lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vesica
      - name: S7/S8 lifecycle evidence
        env:
          VESICA_REQUIRE_NATIVE: "1"
          VESICA_EVIDENCE: ${{ runner.temp }}/lifecycle-evidence-${{ matrix.os }}.md
        run: bash tests/lifecycle-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/lifecycle-evidence-${{ matrix.os }}.md
          if-no-files-found: warn
