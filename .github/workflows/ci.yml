name: ci

on:
  push:
    branches: [main, "task/**"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-test:
    name: fmt + clippy + test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck install.sh tests/install.sh tests/lifecycle-linux.sh tests/discovery-linux.sh scripts/*.sh tests/content-guard.sh tests/release.sh
      - name: Installer integration tests
        run: bash tests/install.sh

  # Plan §5.5 / B8: the public app must stay content-free (org names, GUIDs, internal hosts,
  # SKILL.md/AGENTS.md outside fixtures, gitleaks over full history).
  content-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1 (pinned sha256)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gitleaks.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin" && tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Content-free guard
        run: VESICA_GUARD_REQUIRE_GITLEAKS=1 bash scripts/content-guard.sh
      - name: Guard tests (seeded violations must fail)
        run: VESICA_GUARD_REQUIRE_GITLEAKS=1 bash tests/content-guard.sh

  # Plan §5.5: licences, bans, sources and advisories (cargo-deny) plus RustSec (cargo-audit).
  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny --locked check
      - run: cargo audit --deny warnings

  # Plan §5.5 / B8: a dry-run release builds the static musl artifact and checksums, installs it
  # through install.sh, and runs the S7/S8 lifecycle against that exact binary.
  release-dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Release build and artifact checks
        run: bash tests/release.sh
      - name: S7/S8 lifecycle against the musl release binary
        env:
          VESICA_BIN: target/x86_64-unknown-linux-musl/release/vesica
          VESICA_REQUIRE_NATIVE: "1"
          VESICA_EVIDENCE: ${{ runner.temp }}/lifecycle-evidence-musl.md
        run: bash tests/lifecycle-linux.sh

  # Plan S7/S8: install/uninstall lifecycle and personal-vault/shared-home Git isolation on
  # GitHub-hosted Linux VMs (not containers or WSL). Evidence goes to the job summary and an artifact.
  lifecycle:
    name: lifecycle (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p vesica
      - name: S7/S8 lifecycle evidence
        env:
          VESICA_REQUIRE_NATIVE: "1"
          VESICA_EVIDENCE: ${{ runner.temp }}/lifecycle-evidence-${{ matrix.os }}.md
        run: bash tests/lifecycle-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-evidence-${{ matrix.os }}
          path: ${{ runner.temp }}/lifecycle-evidence-${{ matrix.os }}.md
          if-no-files-found: warn
