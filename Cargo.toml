[workspace]
resolver = "2"
members = [
    "crates/agent-home",
    "crates/ah-core",
    "crates/ah-config",
    "crates/ah-wsl",
    "crates/ah-agents",
    "crates/ah-vault",
    "crates/ah-herdr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/ac-gls/agent-home"
authors = ["Aaron Clayton"]

[workspace.dependencies]
ah-core = { path = "crates/ah-core" }
ah-config = { path = "crates/ah-config" }
ah-wsl = { path = "crates/ah-wsl" }
ah-agents = { path = "crates/ah-agents" }
ah-vault = { path = "crates/ah-vault" }
ah-herdr = { path = "crates/ah-herdr" }

anyhow = "1"
thiserror = "2"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1.2"
toml_edit = "0.25"
jsonc-parser = { version = "0.34", features = ["cst", "serde"] }
sha2 = "0.11"
hex = "0.4"
include_dir = "0.7"
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
walkdir = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

assert_cmd = "2"
predicates = "3"
insta = { version = "1", features = ["json"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
opt-level = "z"
panic = "abort"
